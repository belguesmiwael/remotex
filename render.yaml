services:
  - type: web
    name: remotex-signaling
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set this to your Vercel URL after deploying frontend:
      # - key: ALLOWED_ORIGIN
      #   value: https://remotex-xxx.vercel.app
